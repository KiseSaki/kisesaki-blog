# =================================================================
# KiseSaki Blog 后端应用主配置文件
# 包含所有环境通用的配置，环境特定配置请参考 application-{profile}.yml
# =================================================================

spring:
  # ===== 应用基础配置 =====
  application:
    name: kisesaki-blog-backend

  profiles:
    active: dev # 默认激活开发环境

  main:
    allow-bean-definition-overriding: true

  # ===== Web 相关配置 =====
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  # ===== Jackson 序列化配置 =====
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: NON_NULL
    serialization:
      write-dates-as-timestamps: false

  # ===== 国际化配置 =====
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  # ===== JPA 通用配置 =====
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Shanghai
    open-in-view: false

  # ===== OAuth2 通用配置结构 =====
  security:
    oauth2:
      client:
        provider:
          gitee:
            authorization-uri: https://gitee.com/oauth/authorize
            token-uri: https://gitee.com/oauth/token
            user-info-uri: https://gitee.com/api/v5/user
            user-name-attribute: login

# ===== 服务器配置 =====
server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# ===== 监控配置 =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ===== 日志通用配置 =====
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ===== 控制台输出配置 =====
output:
  ansi:
    enabled: ALWAYS

# =================================================================
# KiseSaki Blog 自定义配置
# =================================================================
kisesaki:
  blog:
    # JWT 默认配置
    jwt:
      expiration: 86400000 # 24小时 (毫秒)
      refresh-expiration: 604800000 # 7天 (毫秒)

    # 文件上传默认配置
    upload:
      max-size: 10MB
      allowed-types:
        - image/jpeg
        - image/png
        - image/gif
        - image/webp

    # 缓存默认配置
    cache:
      default-ttl: 3600 # 1小时 (秒)
      post-ttl: 1800 # 30分钟 (秒)
      category-ttl: 7200 # 2小时 (秒)
