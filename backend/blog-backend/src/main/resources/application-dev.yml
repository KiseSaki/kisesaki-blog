# =================================================================
# 开发环境配置
# 仅包含开发环境特定的配置项
# =================================================================

spring:
  # ===== 数据库配置 =====
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blog} # 数据库连接URL，支持环境变量覆盖
    username: ${DB_USERNAME:kisesaki} # 数据库用户名
    password: ${DB_PASSWORD:password} # 数据库密码
    driver-class-name: org.postgresql.Driver # PostgreSQL JDBC驱动类名
    hikari:
      minimum-idle: 5 # Hikari连接池最小空闲连接数
      maximum-pool-size: 20 # 最大连接池大小
      idle-timeout: 300000 # 连接空闲超时时间（毫秒）
      max-lifetime: 1200000 # 连接最大生命周期（毫秒）
      connection-timeout: 20000 # 连接超时时间（毫秒）

  # ===== JPA 开发环境配置 =====
  jpa:
    hibernate:
      ddl-auto: update # 开发环境自动更新数据库表结构
    show-sql: true # 显示SQL语句，便于调试
    properties:
      hibernate:
        format_sql: true # 格式化SQL输出

  # ===== Redis 配置 =====
  data:
    redis:
      host: ${REDIS_HOST:localhost} # Redis服务器主机地址
      port: ${REDIS_PORT:6379} # Redis服务器端口
      database: ${REDIS_DATABASE:0} # Redis数据库索引
      password: ${REDIS_PASSWORD:} # Redis密码（开发环境通常为空）
      timeout: 5000ms # 连接超时时间
      lettuce:
        pool:
          max-active: 20 # 最大活跃连接数
          max-idle: 10 # 最大空闲连接数
          min-idle: 5 # 最小空闲连接数
          max-wait: 2000ms # 获取连接最大等待时间

  # ===== Kafka 配置 =====
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092} # Kafka引导服务器地址
    security:
      protocol: SASL_PLAINTEXT # 安全协议，使用SASL明文
    properties:
      sasl:
        mechanism: PLAIN # SASL机制
        jaas:
          config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:admin}" password="${KAFKA_PASSWORD:}"; # JAAS配置
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer # 键序列化器
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer # 值序列化器
      acks: all # 确认模式，所有副本确认
      retries: 3 # 重试次数
    consumer:
      group-id: kisesaki-blog-group # 消费者组ID
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer # 键反序列化器
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer # 值反序列化器
      auto-offset-reset: earliest # 自动偏移重置策略
      properties:
        spring.json.trusted.packages: com.kisesaki.blog # 信任的JSON包

  # ===== 邮件配置（开发环境）=====
  mail:
    host: ${kisesaki.blog.email.smtp.host} # SMTP服务器主机
    port: ${kisesaki.blog.email.smtp.port} # SMTP服务器端口
    username: ${kisesaki.blog.email.smtp.username} # SMTP用户名
    password: ${kisesaki.blog.email.smtp.password} # SMTP密码
    properties:
      mail:
        smtp:
          auth: true # 启用SMTP认证
          starttls:
            enable: ${kisesaki.blog.email.tls.enabled} # 启用STARTTLS
            required: ${kisesaki.blog.email.tls.required} # 要求STARTTLS
          ssl:
            enable: true # 启用SSL

  # ===== OAuth2 客户端配置 =====
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:your-github-client-id} # GitHub OAuth2客户端ID
            client-secret: ${GITHUB_CLIENT_SECRET:your-github-client-secret} # GitHub OAuth2客户端密钥
            scope: user:email,read:user # 请求的权限范围
          gitee:
            client-id: ${GITEE_CLIENT_ID:your-gitee-client-id} # Gitee OAuth2客户端ID
            client-secret: ${GITEE_CLIENT_SECRET:your-gitee-client-secret} # Gitee OAuth2客户端密钥
            authorization-grant-type: authorization_code # 授权类型
            redirect-uri: ${GITEE_REDIRECT_URI:http://localhost:3000/auth/gitee/callback} # 重定向URI
            scope: user_info # 请求的权限范围

# ===== 开发环境日志配置 =====
logging:
  level:
    root: WARN # 根日志级别
    com.kisesaki.blog: DEBUG # 应用包调试级别
    com.kisesaki.blog.notification: DEBUG # 邮件通知模块调试日志
    org.springframework.security: DEBUG # Spring Security调试级别
    org.springframework.mail: INFO # Spring Mail日志级别
    org.springframework.retry: DEBUG # 重试机制日志级别
    org.hibernate.SQL: DEBUG # Hibernate SQL调试级别
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE # Hibernate参数绑定跟踪级别
  file:
    name: ./logs/kisesaki-blog-dev.log # 日志文件路径

# =================================================================
# 开发环境自定义配置
# =================================================================

# ===== CORS 开发环境配置 =====
app:
  cors:
    # 开发环境额外允许的域名（Vite开发服务器默认端口）
    additional-origins: http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173,http://192.168.105.173:3000 # 额外允许的CORS源

kisesaki:
  blog:
    # JWT 开发环境配置
    jwt:
      secret: ${JWT_SECRET:kisesaki-blog-jwt-secret-key-for-development-only} # JWT签名密钥

    # 前端应用配置（开发环境）
    frontend:
      base-url: ${FRONTEND_BASE_URL:http://localhost:3000} # 前端应用基础URL

    # 设备指纹安全配置（开发环境）
    security:
      device:
        salt: ${DEVICE_SALT:kisesaki-blog-device-salt-dev-2025} # 设备指纹盐值
        trust-client-fingerprint: ${TRUST_CLIENT_FINGERPRINT:true} # 是否信任客户端指纹

    # 文件上传开发环境配置
    upload:
      path: ${UPLOAD_PATH:./uploads} # 文件上传路径
      base-url: ${FILE_BASE_URL:http://localhost:51073/api/files} # 文件访问基础URL

    # 邮件通知模块配置（开发环境）
    email:
      # SMTP服务器配置
      smtp:
        host: ${MAIL_HOST:smtp.zoho.com} # SMTP主机
        port: ${MAIL_PORT:465} # SMTP端口
        username: ${MAIL_USERNAME:your-email@example.com} # SMTP用户名
        password: ${MAIL_PASSWORD:your-app-password} # SMTP密码
        protocol: smtp # 协议
        default-encoding: UTF-8 # 默认编码

      # TLS/SSL配置
      tls:
        enabled: ${MAIL_TLS_ENABLED:true} # 启用TLS
        required: ${MAIL_TLS_REQUIRED:true} # 要求TLS
