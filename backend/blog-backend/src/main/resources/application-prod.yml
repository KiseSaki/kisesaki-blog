# =================================================================
# 生产环境配置
# 仅包含生产环境特定的配置项，注重性能和安全性
# =================================================================

spring:
  # ===== 数据库配置 =====
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/blog_prod}
    username: ${DATABASE_USERNAME:kisesaki}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
      leak-detection-threshold: 60000

  # ===== JPA 生产环境配置 =====
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  # ===== Redis 配置 =====
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 10
          max-wait: 3000ms

  # ===== Kafka 配置 =====
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    security:
      protocol: SASL_PLAINTEXT
    properties:
      sasl:
        mechanism: PLAIN
        jaas:
          config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:admin}" password="${KAFKA_PASSWORD:}";
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 5
      batch-size: 16384
      linger-ms: 5
      buffer-memory: 33554432
    consumer:
      group-id: kisesaki-blog-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      max-poll-records: 500
      properties:
        spring.json.trusted.packages: com.kisesaki.blog

  # ===== 邮件配置（生产环境）=====
  mail:
    host: ${kisesaki.blog.email.smtp.host}
    port: ${kisesaki.blog.email.smtp.port}
    username: ${kisesaki.blog.email.smtp.username}
    password: ${kisesaki.blog.email.smtp.password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${kisesaki.blog.email.tls.enabled}
            required: ${kisesaki.blog.email.tls.required}

  # ===== OAuth2 客户端配置 =====
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: user:email,read:user
          gitee:
            client-id: ${GITEE_CLIENT_ID}
            client-secret: ${GITEE_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: ${GITEE_REDIRECT_URI}
            scope: user_info

# ===== 服务器生产环境配置 =====
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

# ===== 生产环境监控配置 =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# ===== 生产环境日志配置 =====
logging:
  level:
    root: WARN
    com.kisesaki.blog: INFO
    com.kisesaki.blog.notification: INFO # 邮件通知模块日志
    org.springframework.security: WARN
    org.springframework.mail: WARN # Spring Mail日志
  file:
    name: /var/log/kisesaki-blog/app.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30

# =================================================================
# 生产环境自定义配置
# =================================================================

# ===== CORS 生产环境配置 =====
app:
  cors:
    # 生产环境更严格的CORS配置
    allow-credentials: true
    max-age: 86400 # 24小时
    # 生产环境通常不需要额外的域名，仅使用主前端地址

kisesaki:
  blog:
    # JWT 生产环境配置
    jwt:
      secret: ${JWT_SECRET}

    # 前端应用配置（生产环境）
    frontend:
      base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

    # 设备指纹安全配置（生产环境 - 增强安全性）
    security:
      device:
        salt: ${DEVICE_SALT}
        trust-client-fingerprint: ${TRUST_CLIENT_FINGERPRINT:false}

    # 文件上传生产环境配置
    upload:
      path: ${UPLOAD_PATH:/data/uploads}
      base-url: ${FILE_BASE_URL:http://localhost:51073/api/files}

    # 邮件通知模块配置（生产环境）
    email:
      # SMTP服务器配置
      smtp:
        host: ${MAIL_HOST:smtp.gmail.com}
        port: ${MAIL_PORT:587}
        username: ${MAIL_USERNAME}
        password: ${MAIL_PASSWORD}
        protocol: smtp
        default-encoding: UTF-8

      # TLS/SSL配置
      tls:
        enabled: ${MAIL_TLS_ENABLED:true}
        required: ${MAIL_TLS_REQUIRED:true}
