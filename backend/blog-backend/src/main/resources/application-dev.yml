# =================================================================
# 开发环境配置
# 仅包含开发环境特定的配置项
# =================================================================

spring:
  # ===== 数据库配置 =====
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blog}
    username: ${DB_USERNAME:kisesaki}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000

  # ===== JPA 开发环境配置 =====
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ===== Redis 配置 =====
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms

  # ===== Kafka 配置 =====
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    security:
      protocol: SASL_PLAINTEXT
    properties:
      sasl:
        mechanism: PLAIN
        jaas:
          config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:admin}" password="${KAFKA_PASSWORD:}";
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: kisesaki-blog-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.kisesaki.blog

  # ===== 邮件配置（开发环境）=====
  mail:
    host: ${kisesaki.blog.email.smtp.host}
    port: ${kisesaki.blog.email.smtp.port}
    username: ${kisesaki.blog.email.smtp.username}
    password: ${kisesaki.blog.email.smtp.password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${kisesaki.blog.email.tls.enabled}
            required: ${kisesaki.blog.email.tls.required}
          ssl:
            enable: true

  # ===== OAuth2 客户端配置 =====
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:your-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:your-github-client-secret}
            scope: user:email,read:user
          gitee:
            client-id: ${GITEE_CLIENT_ID:your-gitee-client-id}
            client-secret: ${GITEE_CLIENT_SECRET:your-gitee-client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: ${GITEE_REDIRECT_URI:http://localhost:3000/auth/gitee/callback}
            scope: user_info

# ===== 开发环境日志配置 =====
logging:
  level:
    root: WARN
    com.kisesaki.blog: DEBUG
    com.kisesaki.blog.notification: DEBUG # 邮件通知模块调试日志
    org.springframework.security: DEBUG
    org.springframework.mail: INFO # Spring Mail日志
    org.springframework.retry: DEBUG # 重试机制日志
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  file:
    name: ./logs/kisesaki-blog-dev.log

# =================================================================
# 开发环境自定义配置
# =================================================================

# ===== CORS 开发环境配置 =====
app:
  cors:
    # 开发环境额外允许的域名（Vite开发服务器默认端口）
    additional-origins: http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173

kisesaki:
  blog:
    # JWT 开发环境配置
    jwt:
      secret: ${JWT_SECRET:kisesaki-blog-jwt-secret-key-for-development-only}

    # 前端应用配置（开发环境）
    frontend:
      base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

    # 设备指纹安全配置（开发环境）
    security:
      device:
        salt: ${DEVICE_SALT:kisesaki-blog-device-salt-dev-2025}
        trust-client-fingerprint: ${TRUST_CLIENT_FINGERPRINT:true}

    # 文件上传开发环境配置
    upload:
      path: ${UPLOAD_PATH:./uploads}
      base-url: ${FILE_BASE_URL:http://localhost:51073/api/files}

    # 邮件通知模块配置（开发环境）
    email:
      # SMTP服务器配置
      smtp:
        host: ${MAIL_HOST:smtp.zoho.com}
        port: ${MAIL_PORT:465}
        username: ${MAIL_USERNAME:your-email@example.com}
        password: ${MAIL_PASSWORD:your-app-password}
        protocol: smtp
        default-encoding: UTF-8

      # TLS/SSL配置
      tls:
        enabled: ${MAIL_TLS_ENABLED:true}
        required: ${MAIL_TLS_REQUIRED:true}
