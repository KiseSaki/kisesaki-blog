<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>新功能发布 - KiseSaki博客</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        line-height: 1.6;
        color: #333;
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        background-color: #f8f9fa;
      }
      .container {
        background: white;
        border-radius: 10px;
        padding: 40px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .header {
        text-align: center;
        margin-bottom: 30px;
        background: linear-gradient(135deg, #f59e0b, #d97706);
        color: white;
        padding: 30px;
        border-radius: 10px;
        margin: -40px -40px 30px -40px;
      }
      .logo {
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 10px;
      }
      .button {
        display: inline-block;
        background: #f59e0b;
        color: white;
        padding: 12px 30px;
        text-decoration: none;
        border-radius: 6px;
        font-weight: 500;
        margin: 10px 0;
      }
      .footer {
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #e5e7eb;
        font-size: 14px;
        color: #6b7280;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="logo">🚀 新功能发布</div>
        <h1 style="margin: 0">${featureName}</h1>
      </div>

      <div class="content">
        <p>亲爱的 <strong>${userDisplayName}</strong>，</p>
        <p>我们很高兴地宣布，KiseSaki博客推出了全新功能！</p>

        <h3>功能说明</h3>
        <p>${featureDescription}</p>

        <p><strong>版本：</strong> ${releaseVersion}</p>

        <p style="text-align: center">
          <a href="${blogUrl}" class="button">立即体验</a>
        </p>
      </div>

      <div class="footer">
        <p>© 2024 KiseSaki博客. 保留所有权利。</p>
      </div>
    </div>
  </body>
</html>
